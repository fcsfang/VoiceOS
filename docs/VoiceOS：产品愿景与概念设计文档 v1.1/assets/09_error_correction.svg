ll="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="460" y="511">撤销或补偿误操作</text><rect fill="#FFFFFF" height="99" rx="17" ry="17" stroke="#D9E4ED" stroke-width="1.2" width="320" x="818" y="447" /><rect fill="#2C78A6" height="97" rx="3" width="6" x="819" y="448" /><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="838" y="481">长期关联</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="838" y="511">重新评估旧观点关系</text><line stroke="#9AABB9" stroke-linecap="round" stroke-width="2.5" x1="600" x2="600" y1="550" y2="572" /><polygon fill="#9AABB9" points="600,572 594.5197606320812,563.6353735008481 605.4802393679188,563.6353735008481" /><rect fill="#EAF2F6" height="57" rx="14" ry="14" stroke="none" stroke-width="1.2" width="735" x="233" y="582" /><text fill="#204B6C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="600" y="617">确认影响范围 → 安全修复 → 保留版本与操作记录</text></svg>