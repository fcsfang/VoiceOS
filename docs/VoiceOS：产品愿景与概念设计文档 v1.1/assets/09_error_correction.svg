<svg baseProfile="full" height="688px" version="1.1" viewBox="0 0 1200 688" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FAFBFD" height="688" width="1200" x="0" y="0" /><rect fill="#204B6C" height="9" width="1200" x="0" y="0" /><text fill="#2C78A6" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" text-anchor="start" x="62" y="48">FIGURE 09 · RELIABILITY</text><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" x="62" y="90">纠错需要追踪下游影响，而不只是改一行字</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="62" y="122">发现错误后，先防止持续传播，再检查相关知识、任务与回顾。</text><line stroke="#D9E4ED" stroke-width="1" x1="62" x2="1138" y1="652" y2="652" /><text fill="#7F8D9D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1" text-anchor="start" x="62" y="674">VoiceOS  ·  PRODUCT VISION 1.1</text><rect fill="#FFFFFF" height="95" rx="17" ry="17" stroke="#D9E4ED" stroke-width="1.2" width="530" x="335" y="154" /><rect fill="#B85F62" height="93" rx="3" width="6" x="336" y="155" /><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="355" y="188">发现转写 / 语义 / 归属错误</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="355" y="218">定位原始证据、保留修订记录</text><line stroke="#9AABB9" stroke-linecap="round" stroke-width="2.5" x1="600" x2="600" y1="254" y2="289" /><polygon fill="#9AABB9" points="600,289 594.5197606320812,280.6353735008481 605.4802393679188,280.6353735008481" /><rect fill="#FFFFFF" height="86" rx="17" ry="17" str