<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="680px" version="1.1" viewBox="0 0 1200 680" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FAFBFD" height="680" width="1200" x="0" y="0" /><rect fill="#204B6C" height="9" width="1200" x="0" y="0" /><text fill="#2C78A6" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" text-anchor="start" x="62" y="48">FIGURE 03 · KNOWLEDGE MODEL</text><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" x="62" y="90">资料不等于理解，理解也不等于事实</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="62" y="122">外部资料可以由 AI 预分析；个人认知必须保留真实表达与证据状态。</text><line stroke="#D9E4ED" stroke-width="1" x1="62" x2="1138" y1="644" y2="644" /><text fill="#7F8D9D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1" text-anchor="start" x="62" y="666">VoiceOS  ·  PRODUCT VISION 1.1</text><rect fill="#FFFFFF" height="340" rx="20" ry="20" stroke="#D9E4ED" stroke-width="1.2" width="494" x="62" y="168" /><rect fill="#FFFFFF" height="340" rx="20" ry="20" stroke="#D9E4ED" stroke-width="1.2" width="494" x="644" y="168" /><rect fill="#EDF5FB" height="30" rx="15" ry="15" stroke="none" stroke-width="0" width="205" x="85" y="187" /><text fill="#2C78A6" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="187.5" y="208">L1 · External</text><rect fill="#E9F7F3" height="30" rx="15" ry="15" stroke="none" stroke-width="0" width="205" x="667" y="187" /><text fill="#178B84" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="769.5" y="208">L2 · Personal</text><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" x="85" y="270">外部资料理解层</text><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" x="667" y="270">个人知识与思想层</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="88" y="318">• 论文、网页、访谈与原始资料</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="88" y="361">• 作者论点与 AI 对资料的解析</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="88" y="404">• 不自动代表用户已经理解</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="670" y="318">• 我的解释、判断、疑问与猜想</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="670" y="361">• 明确归属、认可程度与来源</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="670" y="404">• 保留版本与认知变化</text><line stroke="#A0B3C1" stroke-linecap="round" stroke-width="3" x1="562" x2="636" y1="300" y2="300" /><polygon fill="#A0B3C1" points="636,300 627.6353735008481,305.4802393679187 627.6353735008481,294.5197606320813" /><text fill="#2C78A6" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" x="599" y="275">内化</text><rect fill="#EAF0F6" height="77" rx="16" ry="16" stroke="none" stroke-width="1.2" width="1016" x="92" y="532" /><text fill="#204B6C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" x="118" y="565">两个维度必须独立</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="118" y="591">① 认知归属：谁说的？谁认可？     ② 证据状态：是否得到支持或验证？</text></svg>