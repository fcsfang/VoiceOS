xt fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="460" y="551">值得保留，不要求回应</text><rect fill="#FFFFFF" height="105" rx="17" ry="17" stroke="#D9E4ED" stroke-width="1.2" width="320" x="818" y="487" /><rect fill="#2C78A6" height="103" rx="3" width="6" x="819" y="488" /><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="838" y="521">不触达</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="838" y="551">当前价值不足或用户已暂停</text><rect fill="#EAF1F7" height="46" rx="12" ry="12" stroke="none" stroke-width="1.2" width="908" x="146" y="610" /><text fill="#204B6C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="600" y="640">无强制回复 · 无连续打卡 · 跳过不触发催促</text></svg>