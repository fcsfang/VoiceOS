<svg baseProfile="full" height="700px" version="1.1" viewBox="0 0 1200 700" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FAFBFD" height="700" width="1200" x="0" y="0" /><rect fill="#204B6C" height="9" width="1200" x="0" y="0" /><text fill="#2C78A6" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" text-anchor="start" x="62" y="48">FIGURE 06 · PROACTIVITY</text><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" x="62" y="90">后台高度主动，前台尊重注意力</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="62" y="122">AI 主动发现价值，但“发现值得关注”不等于“必须立即通知”。</text><line stroke="#D9E4ED" stroke-width="1" x1="62" x2="1138" y1="664" y2="664" /><text fill="#7F8D9D" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1" text-anchor="start" x="62" y="686">VoiceOS  ·  PRODUCT VISION 1.1</text><rect fill="#FFFFFF" height="108" rx="17" ry="17" stroke="#D9E4ED" stroke-width="1.2" width="614" x="293" y="167" /><rect fill="#2C78A6" height="106" rx="3" width="6" x="294" y="168" /><text fill="#14293F" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="313" y="201">主动智能引擎</text><text fill="#52677C" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="313" y="231">历史观点 · 任务进度 · 当前情境</text><line stroke="#9AABB9" stroke-linecap="round" stroke-width="2.5" x1="600" x2="600" y1="280" y2="314" /><polygon fill="#9AABB9" points="600,314 594.5197606320812,305.6353735008481 605.4802393679188,305.6353735008481" /><rect fill="#FFFFFF" height="90" rx="17" ry="17" stroke="